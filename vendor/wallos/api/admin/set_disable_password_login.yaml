post:
  summary: Disable Password Login
  description: Controls whether standard password-based login is allowed or if
    OIDC is strictly enforced. Requires user ID 1 (Admin role).
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            api_key:
              type: string
              description: The Admin's Wallos API Key.
            disable:
              type: string
              enum:
                - "0"
                - "1"
              description: "'1' to disable standard password logins, '0' to enable standard
                password logins."
          required:
            - api_key
            - disable
  responses:
    "200":
      description: Operation processed successfully. Returns JSON.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: True if settings were updated.
              title:
                type: string
                description: Brief status title.
              message:
                type: string
                description: Description of the result or error.
          examples:
            UpdateSuccess:
              summary: Successful Password Login Disabling
              value:
                success: true
                title: Updated
                message: Password login has been disabled.
            EnvOverride:
              summary: Overridden by Host Environment
              value:
                success: false
                title: Managed by environment
                message: Password login is managed by the OIDC_DISABLE_PASSWORD_LOGIN
                  environment variable.
