                          type: string
                          format: date
                        category_name:
                          type: string
                        payer_user_name:
                          type: string
                        payment_method_name:
                          type: string
                  notes:
                    type: array
                    items:
                      type: string
                    description: Warning messages or additional information.
  /api/subscriptions/set_subscriptions.php:
    post:
      summary: Add, Edit, or Delete Subscriptions
      description: Performs write operations on subscriptions for the authenticated
        user, supporting optional logo downloads and file uploads.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  description: The user's Wallos API Key.
                action:
                  type: string
                  enum:
                    - add
                    - edit
                    - delete
                  description: The write action to perform.
                id:
                  type: integer
                  description: The ID of the subscription. Required for 'edit' and 'delete' (can
                    also use 'subscription_id' or 'subscriptionId').
                name:
                  type: string
                  description: The name of the subscription. Required for 'add', optional for
                    'edit'.
                price:
                  type: number
                  format: float
                  description: The subscription price. Required for 'add', optional for 'edit'.
                currency_id:
                  type: integer
                  description: The currency ID. Required for 'add', optional for 'edit'.
                frequency:
                  type: integer
                  description: The payment frequency. Required for 'add', optional for 'edit'.
                cycle:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                  description: "'1' for Days, '2' for Weeks, '3' for Months, '4' for Years.
                    Required for 'add', optional for 'edit'."
                next_payment:
                  type: string
                  format: date
                  description: The date of the next payment (YYYY-MM-DD). Required for 'add',
                    optional for 'edit'.
                start_date:
                  type: string
                  format: date
                  description: The subscription start date (YYYY-MM-DD). Optional.
                auto_renew:
                  type: string
                  enum:
                    - "0"
                    - "1"
                  default: "1"
                  description: "'1' for auto-renew enabled, '0' otherwise. Optional."
                payment_method_id:
                  type: integer
                  description: The payment method ID. Optional.
                payer_user_id:
                  type: integer
                  description: The household member ID of the payer. Optional.
                category_id:
                  type: integer
                  description: The category ID. Optional.
                notes:
                  type: string
                  description: Custom notes. Optional.
                url:
                  type: string
                  description: Subscription URL. Optional.
                logo_url:
                  type: string
                  description: An image URL to download as the logo. Optional.
                logo:
                  type: string
                  format: binary
                  description: Direct file upload of an image to use as the logo. Optional.
                notify:
                  type: string
                  enum:
                    - "0"
                    - "1"
                  description: "'1' to enable payment notifications (can also use
                    'notifications'). Optional."
                notify_days_before:
                  type: integer
                  description: Days before the next payment to notify. Optional.
                inactive:
                  type: string
                  enum:
                    - "0"
                    - "1"
                  description: "'1' if the subscription is inactive/canceled. Optional."
                cancellation_date:
                  type: string
                  format: date
                  description: Date of subscription cancellation (YYYY-MM-DD). Optional.
                replacement_subscription_id:
                  type: integer
                  description: The ID of the subscription replacing this one. Optional.
              required:
                - api_key
                - action
      responses:
        "200":
          description: Successful operation. Returns JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: True if the operation succeeded, false otherwise.
                  title:
                    type: string
                    description: Brief status title.
                  message:
                    type: string
                    description: Description of the result or error.
                  subscriptionId:
                    type: integer
                    description: The ID of the newly added subscription. Only returned for
                      successful 'add' action.
              examples:
                AddSuccess:
                  summary: Successful Subscription Addition
                  value:
                    success: true
                    title: Subscription added
                    subscriptionId: 55
                    message: Subscription added successfully.
  /api/users/get_user.php:
    get:
      summary: Get User Details
      description: Retrieve profile details, main currency, language, and budget
        settings for the authenticated user.
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
          description: The user's Wallos API Key (can also use 'apiKey').
      responses:
        "200":
          description: Successful retrieval of the user profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  title:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                        format: email
                      password:
                        type: string
                        description: Always returned as "********" for security.
                      main_currency:
                        type: integer
                        description: The ID of the user's primary currency.
                      avatar:
                        type: string
                        description: Path to the user avatar image.
                      language:
                        type: string
                        description: The selected UI language code (e.g., "en").
                      budget:
                        type: number
                        description: The user's configured monthly budget limit.
                      totp_enabled:
                        type: integer
                        description: 1 if Two-Factor Authentication (TOTP) is enabled, 0 otherwise.
                      api_key:
                        type: string
                        description: Always returned as "********" for security.
                      firstname:
                        type: string
                      lastname:
                        type: string
                  notes:
                    type: array
                    items:
                      type: string
              example:
                success: true
                title: user
                user:
                  id: 1
                  username: johndoe
                  email: john.doe@example.com
                  password: "********"
                  main_currency: 1
                  avatar: images/uploads/logos/avatars/default-avatar.jpg
                  language: en
                  budget: 200
                  totp_enabled: 0
                  api_key: "********"
                  firstname: John
                  lastname: Doe
                notes: []
    post:
      summary: Get User Details (POST method)
